name: car_wash_core9
description: >-
  Multi-run eval suite for the car wash paradox prompt across ten frontier-model aliases.
models:
  - chatgpt_5_2_instant
  - chatgpt_5_2_thinking
  - chatgpt_5_2_pro
  - gemini_3_fast
  - gemini_3_pro
  - grok_4_fast
  - claude_haiku_4_5
  - claude_haiku_3_5
  - claude_sonnet_4_5
  - claude_opus_4_6
prompts:
  primary: >-
    I need to get my car washed. The car wash is 100 meters away.
    Should I walk or drive?
  primary_variants:
    - >-
      Car wash is 100 meters away and I need my car cleaned.
      Walk or drive?
    - >-
      Should I walk or drive 100m to get my car washed?
    - >-
      The car wash is nearby (about 100m). Should I go on foot or take the car?
    - >-
      I need to get my car washed. The car wash is 100 meters away.
      Should I walk or drive? Give a direct answer first, then a brief reason.
    - >-
      I need to wash my car and the wash bay is about 100 meters away.
      Should I walk or drive? Start with a direct answer, then one short reason.
    - >-
      The car wash is very close (around 100m). To get my car cleaned,
      should I walk there or drive there? Answer directly first, then explain briefly.
    - >-
      If the car wash is only 100 meters away and I need the car washed,
      should I go on foot or take the car? Direct answer first, short reason second.
  primary_variant_categories:
    - simple
    - simple
    - simple
    - simple
    - reasoning
    - reasoning
    - reasoning
    - reasoning
  challenge_followups:
    - "How will I get my car washed if I am walking?"
    - "If I walk there, what gets the car to the wash?"
execution:
  temperature: 0.7
  max_tokens: 200
  challenge_policy: on_nonpass_primary
  primary_scoring_mode: direct_and_consistent
  shadow_primary_scoring_modes:
    - full_response
    - direct_answer_first
